name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Clean build directory
        rm -rf DerivedData build
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Find object files and swiftmodule directories
        echo "🔍 Finding build artifacts..."
        
        IOS_OBJ_DIR="DerivedData/Build/Intermediates.noindex/CookiePrimeConsent.build/Release-iphoneos/CookiePrimeConsent.build/Objects-normal/arm64"
        SIM_OBJ_DIR="DerivedData/Build/Intermediates.noindex/CookiePrimeConsent.build/Release-iphonesimulator/CookiePrimeConsent.build/Objects-normal/arm64"
        
        IOS_SWIFTMODULE="DerivedData/Build/Products/Release-iphoneos/CookiePrimeConsent.swiftmodule"
        SIM_SWIFTMODULE="DerivedData/Build/Products/Release-iphonesimulator/CookiePrimeConsent.swiftmodule"
        
        mkdir -p build
        
        # Create static libraries
        echo "📦 Creating iOS static library..."
        find "$IOS_OBJ_DIR" -name "*.o" -exec libtool -static -o build/libCookiePrimeConsent-ios.a {} \+ 2>/dev/null || true
        echo "✅ iOS static library created"
        
        echo "📦 Creating Simulator static library..."
        find "$SIM_OBJ_DIR" -name "*.o" -exec libtool -static -o build/libCookiePrimeConsent-sim.a {} \+ 2>/dev/null || true
        echo "✅ Simulator static library created"
        
        # Create framework structure
        echo "📦 Creating framework structure..."
        
        mkdir -p build/ios/CookiePrimeConsent.framework/Modules
        mkdir -p build/ios/CookiePrimeConsent.framework/Headers
        mkdir -p build/sim/CookiePrimeConsent.framework/Modules
        mkdir -p build/sim/CookiePrimeConsent.framework/Headers
        
        # Copy static library as framework binary
        cp build/libCookiePrimeConsent-ios.a build/ios/CookiePrimeConsent.framework/CookiePrimeConsent
        cp build/libCookiePrimeConsent-sim.a build/sim/CookiePrimeConsent.framework/CookiePrimeConsent
        
        # Copy Swift module files
        echo "📦 Copying Swift module files..."
        
        if [ -d "$IOS_SWIFTMODULE" ]; then
          cp -r "$IOS_SWIFTMODULE"/* build/ios/CookiePrimeConsent.framework/Modules/ 2>/dev/null || true
        fi
        
        if [ -d "$SIM_SWIFTMODULE" ]; then
          cp -r "$SIM_SWIFTMODULE"/* build/sim/CookiePrimeConsent.framework/Modules/ 2>/dev/null || true
        fi
        
        # Create Info.plist
        cat > build/ios/CookiePrimeConsent.framework/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>CookiePrimeConsent</string>
            <key>CFBundleIdentifier</key><string>com.cookieprime.consent</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>CookiePrimeConsent</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
        </dict>
        </plist>
        EOF
        cp build/ios/CookiePrimeConsent.framework/Info.plist build/sim/CookiePrimeConsent.framework/Info.plist
        
        # Create module map
        cat > build/ios/CookiePrimeConsent.framework/Modules/module.modulemap << 'EOF'
        framework module CookiePrimeConsent {
          export *
        }
        EOF
        cp build/ios/CookiePrimeConsent.framework/Modules/module.modulemap build/sim/CookiePrimeConsent.framework/Modules/
        
        # Verify frameworks
        echo "=== iOS Framework ==="
        ls -la build/ios/CookiePrimeConsent.framework/
        echo "=== iOS Modules ==="
        ls -la build/ios/CookiePrimeConsent.framework/Modules/
        
        echo "=== Simulator Framework ==="
        ls -la build/sim/CookiePrimeConsent.framework/
        echo "=== Simulator Modules ==="
        ls -la build/sim/CookiePrimeConsent.framework/Modules/
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework build/ios/CookiePrimeConsent.framework \
            -framework build/sim/CookiePrimeConsent.framework \
            -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Verify structure
        echo "📦 Verifying XCFramework..."
        find CookiePrimeConsent.xcframework -type f | head -30
        
        # Check for swiftinterface files
        echo "📦 Checking for swiftinterface files..."
        find CookiePrimeConsent.xcframework -name "*.swiftinterface" | head -10
        
        # Zip
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        echo "✅ Build complete!"
        echo "📦 Artifact: CookiePrimeConsent.xcframework.zip"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CookiePrimeConsent.xcframework.zip
        generate_release_notes: true
