name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Create Package.swift
      run: |
        cat > Package.swift << 'EOF'
        // swift-tools-version:5.9
        import PackageDescription

        let package = Package(
            name: "CookiePrimeConsent",
            platforms: [
                .iOS(.v14)
            ],
            products: [
                .library(
                    name: "CookiePrimeConsent",
                    targets: ["CookiePrimeConsent"]
                )
            ],
            dependencies: [],
            targets: [
                .target(
                    name: "CookiePrimeConsent",
                    path: "Sources/CookiePrimeConsent",
                    resources: [
                        .process("Resources")
                    ],
                    swiftSettings: [
                        .define("DEBUG", .when(configuration: .debug))
                    ]
                )
            ]
        )
        EOF
        echo "✅ Package.swift created"
    
    - name: Build XCFramework (Debug)
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework in Debug mode..."
        echo "📁 Sources: $(find Sources -name "*.swift" | wc -l | xargs) Swift files"
        
        # Build for iOS (device)
        echo "📱 Building for iOS..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/ios-simulator.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Find the actual framework paths
        echo "🔍 Finding framework paths..."
        
        # For iOS device
        IOS_FRAMEWORK=$(find build/ios.xcarchive -name "*.framework" -type d | head -1)
        if [ -z "$IOS_FRAMEWORK" ]; then
            echo "❌ No framework found in iOS archive"
            echo "Contents of iOS archive:"
            find build/ios.xcarchive -type d | head -20
            exit 1
        fi
        echo "iOS framework: $IOS_FRAMEWORK"
        
        # For Simulator
        SIM_FRAMEWORK=$(find build/ios-simulator.xcarchive -name "*.framework" -type d | head -1)
        if [ -z "$SIM_FRAMEWORK" ]; then
            echo "❌ No framework found in Simulator archive"
            echo "Contents of Simulator archive:"
            find build/ios-simulator.xcarchive -type d | head -20
            exit 1
        fi
        echo "Simulator framework: $SIM_FRAMEWORK"
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework "$IOS_FRAMEWORK" \
            -framework "$SIM_FRAMEWORK" \
            -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Zip
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        echo "✅ Zip complete"
        
        # Show final output
        echo "📦 Build artifacts:"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
