name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device (dynamic framework)
        echo "📱 Building for iOS device..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/ios.xcarchive" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -quiet || { echo "❌ iOS archive failed"; exit 1; }
        echo "✅ iOS archive succeeded"
        
        # Build for iOS Simulator (dynamic framework)
        echo "📱 Building for iOS Simulator..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "build/sim.xcarchive" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -quiet || { echo "❌ Simulator archive failed"; exit 1; }
        echo "✅ Simulator archive succeeded"
        
        # Create XCFramework from archives
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework "build/ios.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework" \
            -framework "build/sim.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework" \
            -output "CookiePrimeConsent.xcframework" \
            || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Verify structure
        echo "📦 Verifying XCFramework structure..."
        find CookiePrimeConsent.xcframework -type f | sort
        
        # Check module maps are correct
        echo "🔍 Checking module maps..."
        for map in $(find CookiePrimeConsent.xcframework -name "module.modulemap"); do
          echo "=== $map ==="
          cat "$map"
        done
        
        # Zip
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        echo "✅ Build complete!"
        echo "📦 Artifact: CookiePrimeConsent.xcframework.zip"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CookiePrimeConsent.xcframework.zip
        generate_release_notes: true
