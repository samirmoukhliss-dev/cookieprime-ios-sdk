name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Find the built frameworks
        echo "🔍 Locating built frameworks..."
        
        IOS_FRAMEWORK=$(find DerivedData -path "*/Release-iphoneos/CookiePrimeConsent.framework" -type d | head -1)
        SIM_FRAMEWORK=$(find DerivedData -path "*/Release-iphonesimulator/CookiePrimeConsent.framework" -type d | head -1)
        
        if [ -z "$IOS_FRAMEWORK" ]; then
            echo "❌ Could not find iOS framework"
            find DerivedData -name "*.framework" -type d
            exit 1
        fi
        
        if [ -z "$SIM_FRAMEWORK" ]; then
            echo "❌ Could not find Simulator framework"
            find DerivedData -name "*.framework" -type d
            exit 1
        fi
        
        echo "✅ iOS Framework: $IOS_FRAMEWORK"
        echo "✅ Simulator Framework: $SIM_FRAMEWORK"
        
        # Verify module maps exist and fix if needed
        echo "🔍 Checking module maps..."
        for fw in "$IOS_FRAMEWORK" "$SIM_FRAMEWORK"; do
            MODULE_MAP="$fw/Modules/module.modulemap"
            if [ -f "$MODULE_MAP" ]; then
                echo "Found module map: $MODULE_MAP"
                cat "$MODULE_MAP"
                
                # Check if it's the minimal broken one and fix it
                if grep -q "^framework module CookiePrimeConsent {$" "$MODULE_MAP" && ! grep -q "requires" "$MODULE_MAP"; then
                    echo "⚠️ Module map is minimal, patching..."
                    printf '%s\n' 'framework module CookiePrimeConsent {' '  requires objc, objc_arc' '  export *' '  module * { export * }' '}' > "$MODULE_MAP"
                    echo "✅ Patched module map"
                fi
            else
                echo "⚠️ No module map found, creating one..."
                mkdir -p "$fw/Modules"
                printf '%s\n' 'framework module CookiePrimeConsent {' '  requires objc, objc_arc' '  export *' '  module * { export * }' '}' > "$MODULE_MAP"
                echo "✅ Created module map"
            fi
        done
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework "$IOS_FRAMEWORK" \
            -framework "$SIM_FRAMEWORK" \
            -output "CookiePrimeConsent.xcframework" \
            || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Verify structure
        echo "📦 Verifying XCFramework structure..."
        find CookiePrimeConsent.xcframework -type f | sort
        
        # Final check of module maps in XCFramework
        echo "🔍 Final module map check..."
        for map in $(find CookiePrimeConsent.xcframework -name "module.modulemap"); do
          echo "=== $map ==="
          cat "$map"
        done
        
        # Zip
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        echo "✅ Build complete!"
        echo "📦 Artifact: CookiePrimeConsent.xcframework.zip"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CookiePrimeConsent.xcframework.zip
        generate_release_notes: true
