name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Archive for iOS device
        echo "📱 Archiving for iOS device..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/ios.xcarchive" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            SWIFT_VERSION=5.9 \
            -quiet || { echo "❌ iOS archive failed"; exit 1; }
        echo "✅ iOS archive succeeded"
        
        # Archive for iOS Simulator
        echo "📱 Archiving for iOS Simulator..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -archivePath "build/ios-simulator.xcarchive" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            SWIFT_VERSION=5.9 \
            -quiet || { echo "❌ Simulator archive failed"; exit 1; }
        echo "✅ Simulator archive succeeded"
        
        # Find the actual framework paths within the archives
        echo "🔍 Finding frameworks in archives..."
        
        IOS_FRAMEWORK=$(find build/ios.xcarchive -name "CookiePrimeConsent.framework" -type d | head -1)
        SIM_FRAMEWORK=$(find build/ios-simulator.xcarchive -name "CookiePrimeConsent.framework" -type d | head -1)
        
        echo "iOS framework: $IOS_FRAMEWORK"
        echo "Simulator framework: $SIM_FRAMEWORK"
        
        if [ -z "$IOS_FRAMEWORK" ] || [ -z "$SIM_FRAMEWORK" ]; then
            echo "❌ Could not find frameworks"
            echo "=== iOS archive contents ==="
            find build/ios.xcarchive -type d | head -20
            echo "=== Simulator archive contents ==="
            find build/ios-simulator.xcarchive -type d | head -20
            exit 1
        fi
        
        # Verify .swiftinterface files
        echo "🔍 Checking for .swiftinterface files..."
        find "$IOS_FRAMEWORK" -name "*.swiftinterface" | head -5
        find "$SIM_FRAMEWORK" -name "*.swiftinterface" | head -5
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework "$IOS_FRAMEWORK" \
            -framework "$SIM_FRAMEWORK" \
            -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Verify structure
        echo "📦 Verifying XCFramework..."
        find CookiePrimeConsent.xcframework -type f | head -20
        
        # Zip
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        echo "✅ Build complete!"
        echo "📦 Artifact: CookiePrimeConsent.xcframework.zip"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CookiePrimeConsent.xcframework.zip
        generate_release_notes: true
