name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework with SPM
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS (device)
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -destination "generic/platform=iOS" \
            -archivePath build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            -scmProvider system \
            || echo "⚠️ Build failed but continuing..."
        
        # Build for Simulator
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/ios-simulator.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            -scmProvider system \
            || echo "⚠️ Simulator build failed but continuing..."
        
        # Check if builds succeeded
        if [ ! -d "build/ios.xcarchive" ] || [ ! -d "build/ios-simulator.xcarchive" ]; then
            echo "❌ Build failed - no archives found"
            ls -la build/ || echo "No build directory"
            exit 1
        fi
        
        # Create XCFramework
        xcodebuild -create-xcframework \
            -framework build/ios.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework \
            -framework build/ios-simulator.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework \
            -output CookiePrimeConsent.xcframework
        
        # Zip
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework
        
        echo "✅ Build complete!"
        ls -la CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
