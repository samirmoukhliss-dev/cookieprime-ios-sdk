name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -sdk iphoneos \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -sdk iphonesimulator \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Find the built products
        echo "🔍 Finding build products..."
        
        IOS_DIR="DerivedData/Build/Products/Release-iphoneos"
        SIM_DIR="DerivedData/Build/Products/Release-iphonesimulator"
        
        # Find the static library
        IOS_LIB=$(find "$IOS_DIR" -name "*.a" -type f | head -1)
        SIM_LIB=$(find "$SIM_DIR" -name "*.a" -type f | head -1)
        
        if [ -z "$IOS_LIB" ] || [ -z "$SIM_LIB" ]; then
            echo "❌ Could not find static libraries"
            echo "iOS dir contents:"
            ls -la "$IOS_DIR"
            echo "Simulator dir contents:"
            ls -la "$SIM_DIR"
            exit 1
        fi
        
        echo "iOS static library: $IOS_LIB"
        echo "Simulator static library: $SIM_LIB"
        
        # Find module maps
        IOS_MODULE="$IOS_DIR/CookiePrimeConsent.swiftmodule"
        SIM_MODULE="$SIM_DIR/CookiePrimeConsent.swiftmodule"
        
        echo "iOS module: $IOS_MODULE"
        echo "Simulator module: $SIM_MODULE"
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        
        # Use xcodebuild to create XCFramework with the static libraries and module maps
        xcodebuild -create-xcframework \
            -library "$IOS_LIB" \
            -headers Sources/CookiePrimeConsent \
            -library "$SIM_LIB" \
            -headers Sources/CookiePrimeConsent \
            -output CookiePrimeConsent.xcframework 2>&1 | tee xcframework.log
        
        if [ ! -d "CookiePrimeConsent.xcframework" ]; then
            echo "❌ XCFramework creation failed"
            cat xcframework.log
            exit 1
        fi
        echo "✅ XCFramework created"
        
        # Verify the XCFramework
        echo "📦 Verifying XCFramework..."
        find CookiePrimeConsent.xcframework -type f | head -20
        
        # Zip it
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        # Show final output
        echo "✅ Build complete!"
        echo "📦 Artifact size: $(du -h CookiePrimeConsent.xcframework.zip | cut -f1)"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
