name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Check Project Type
      run: |
        echo "🔍 Checking project structure..."
        ls -la
        echo ""
        echo "=== Package.swift ==="
        cat Package.swift 2>/dev/null || echo "No Package.swift"
        echo ""
        echo "=== Schemes ==="
        xcodebuild -list 2>/dev/null | head -30 || echo "Could not list schemes"
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Find the built products
        echo "🔍 Finding built products..."
        
        IOS_PRODUCT=$(find DerivedData -path "*/Release-iphoneos/*" -name "CookiePrimeConsent" | head -1)
        SIM_PRODUCT=$(find DerivedData -path "*/Release-iphonesimulator/*" -name "CookiePrimeConsent" | head -1)
        
        echo "iOS product: $IOS_PRODUCT"
        echo "Simulator product: $SIM_PRODUCT"
        
        if [ -z "$IOS_PRODUCT" ] || [ -z "$SIM_PRODUCT" ]; then
            echo "❌ Could not find built products"
            find DerivedData -name "CookiePrimeConsent" | head -10
            exit 1
        fi
        
        # Check what type of files these are
        echo "=== File types ==="
        file "$IOS_PRODUCT"
        file "$SIM_PRODUCT"
        
        # For SPM static libraries, create frameworks manually
        echo "📦 Creating framework structure..."
        
        mkdir -p build/ios/CookiePrimeConsent.framework/Headers
        mkdir -p build/ios/CookiePrimeConsent.framework/Modules
        mkdir -p build/sim/CookiePrimeConsent.framework/Headers
        mkdir -p build/sim/CookiePrimeConsent.framework/Modules
        
        # Copy the static library as the framework binary
        cp "$IOS_PRODUCT" build/ios/CookiePrimeConsent.framework/CookiePrimeConsent
        cp "$SIM_PRODUCT" build/sim/CookiePrimeConsent.framework/CookiePrimeConsent
        
        # Find and copy module files
        IOS_MODULE=$(find DerivedData -path "*/Release-iphoneos/*" -name "*.swiftmodule" -type d | grep CookiePrimeConsent | head -1)
        SIM_MODULE=$(find DerivedData -path "*/Release-iphonesimulator/*" -name "*.swiftmodule" -type d | grep CookiePrimeConsent | head -1)
        
        echo "iOS module: $IOS_MODULE"
        echo "Simulator module: $SIM_MODULE"
        
        if [ -d "$IOS_MODULE" ]; then
            cp -r "$IOS_MODULE" build/ios/CookiePrimeConsent.framework/Modules/
        fi
        if [ -d "$SIM_MODULE" ]; then
            cp -r "$SIM_MODULE" build/sim/CookiePrimeConsent.framework/Modules/
        fi
        
        # Also copy .swiftinterface files if they exist
        find DerivedData -path "*/Release-iphoneos/*" -name "*.swiftinterface" | grep CookiePrimeConsent | while read f; do
            cp "$f" build/ios/CookiePrimeConsent.framework/Modules/
        done
        find DerivedData -path "*/Release-iphonesimulator/*" -name "*.swiftinterface" | grep CookiePrimeConsent | while read f; do
            cp "$f" build/sim/CookiePrimeConsent.framework/Modules/
        done
        
        # Create Info.plist
        cat > build/ios/CookiePrimeConsent.framework/Info.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key><string>CookiePrimeConsent</string>
            <key>CFBundleIdentifier</key><string>com.cookieprime.consent</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>CookiePrimeConsent</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleVersion</key><string>1</string>
        </dict>
        </plist>
        EOF
        cp build/ios/CookiePrimeConsent.framework/Info.plist build/sim/CookiePrimeConsent.framework/Info.plist
        
        # Create module map
        cat > build/ios/CookiePrimeConsent.framework/Modules/module.modulemap << 'EOF'
        framework module CookiePrimeConsent {
          export *
        }
        EOF
        cp build/ios/CookiePrimeConsent.framework/Modules/module.modulemap build/sim/CookiePrimeConsent.framework/Modules/
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework build/ios/CookiePrimeConsent.framework \
            -framework build/sim/CookiePrimeConsent.framework \
            -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Verify structure
        echo "📦 Verifying XCFramework..."
        find CookiePrimeConsent.xcframework -type f | head -20
        
        # Zip
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        echo "✅ Build complete!"
        echo "📦 Artifact: CookiePrimeConsent.xcframework.zip"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CookiePrimeConsent.xcframework.zip
        generate_release_notes: true
