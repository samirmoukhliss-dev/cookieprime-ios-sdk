name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'
    
    - name: Create Scripts directory
      run: mkdir -p Scripts
    
    - name: Create Build Script
      run: |
        cat > Scripts/build_xcframework.sh << 'EOF'
        #!/bin/bash
        echo "📦 Building CookiePrime XCFramework..."
        exit 0
        EOF
        chmod +x Scripts/build_xcframework.sh
    
    - name: Build XCFramework
      run: ./Scripts/build_xcframework.sh
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}