name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Debug: Show all build products
        echo "=== Build Products Directory ==="
        ls -la DerivedData/Build/Products/
        echo ""
        echo "=== Release-iphoneos ==="
        ls -la DerivedData/Build/Products/Release-iphoneos/ 2>/dev/null || echo "Directory not found"
        echo ""
        echo "=== Release-iphonesimulator ==="
        ls -la DerivedData/Build/Products/Release-iphonesimulator/ 2>/dev/null || echo "Directory not found"
        echo ""
        echo "=== Full find for .framework ==="
        find DerivedData -name "*.framework" -type d 2>/dev/null || echo "No frameworks found"
        echo ""
        echo "=== Full find for .a ==="
        find DerivedData -name "*.a" -type f 2>/dev/null | head -10
        echo ""
        echo "=== Full find for .swiftmodule ==="
        find DerivedData -name "*.swiftmodule" -type d 2>/dev/null | head -10
        
        # Find frameworks using broader search
        echo "🔍 Finding frameworks..."
        
        # Look for iOS framework - check standard locations
        IOS_FRAMEWORK=""
        if [ -d "DerivedData/Build/Products/Release-iphoneos/CookiePrimeConsent.framework" ]; then
          IOS_FRAMEWORK="DerivedData/Build/Products/Release-iphoneos/CookiePrimeConsent.framework"
        elif [ -d "DerivedData/Build/Products/Release-iphoneos/PackageFrameworks/CookiePrimeConsent.framework" ]; then
          IOS_FRAMEWORK="DerivedData/Build/Products/Release-iphoneos/PackageFrameworks/CookiePrimeConsent.framework"
        fi
        
        SIM_FRAMEWORK=""
        if [ -d "DerivedData/Build/Products/Release-iphonesimulator/CookiePrimeConsent.framework" ]; then
          SIM_FRAMEWORK="DerivedData/Build/Products/Release-iphonesimulator/CookiePrimeConsent.framework"
        elif [ -d "DerivedData/Build/Products/Release-iphonesimulator/PackageFrameworks/CookiePrimeConsent.framework" ]; then
          SIM_FRAMEWORK="DerivedData/Build/Products/Release-iphonesimulator/PackageFrameworks/CookiePrimeConsent.framework"
        fi
        
        echo "iOS framework: $IOS_FRAMEWORK"
        echo "Simulator framework: $SIM_FRAMEWORK"
        
        if [ -z "$IOS_FRAMEWORK" ] || [ -z "$SIM_FRAMEWORK" ]; then
          echo "❌ Could not find frameworks"
          echo "=== Full find for CookiePrimeConsent ==="
          find DerivedData -name "*CookiePrimeConsent*" -type d 2>/dev/null | head -20
          exit 1
        fi
        
        # Verify frameworks
        echo "=== iOS Framework ==="
        ls -la "$IOS_FRAMEWORK"
        echo "=== Simulator Framework ==="
        ls -la "$SIM_FRAMEWORK"
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework "$IOS_FRAMEWORK" \
            -framework "$SIM_FRAMEWORK" \
            -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Verify structure
        echo "📦 Verifying XCFramework..."
        find CookiePrimeConsent.xcframework -type f | head -30
        
        # Zip
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        echo "✅ Build complete!"
        echo "📦 Artifact: CookiePrimeConsent.xcframework.zip"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CookiePrimeConsent.xcframework.zip
        generate_release_notes: true
