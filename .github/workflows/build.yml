name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        
        # Find the built frameworks
        IOS_FRAMEWORK=$(find DerivedData/Build/Products/Release-iphoneos -name "*.framework" -type d | head -1)
        SIM_FRAMEWORK=$(find DerivedData/Build/Products/Release-iphonesimulator -name "*.framework" -type d | head -1)
        
        if [ -z "$IOS_FRAMEWORK" ] || [ -z "$SIM_FRAMEWORK" ]; then
            echo "❌ Could not find frameworks"
            echo "iOS path contents:"
            find DerivedData/Build/Products/Release-iphoneos -type d | head -10
            echo "Simulator path contents:"
            find DerivedData/Build/Products/Release-iphonesimulator -type d | head -10
            exit 1
        fi
        
        echo "iOS framework: $IOS_FRAMEWORK"
        echo "Simulator framework: $SIM_FRAMEWORK"
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework "$IOS_FRAMEWORK" \
            -framework "$SIM_FRAMEWORK" \
            -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        
        # Zip it
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework
        echo "✅ Build complete! Size: $(du -h CookiePrimeConsent.xcframework.zip | cut -f1)"
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
