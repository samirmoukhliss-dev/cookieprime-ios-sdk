name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Create Package.swift
      run: |
        cat > Package.swift << 'EOF'
        // swift-tools-version:5.9
        import PackageDescription

        let package = Package(
            name: "CookiePrimeConsent",
            platforms: [
                .iOS(.v14)
            ],
            products: [
                .library(
                    name: "CookiePrimeConsent",
                    targets: ["CookiePrimeConsent"]
                )
            ],
            dependencies: [],
            targets: [
                .target(
                    name: "CookiePrimeConsent",
                    path: "Sources/CookiePrimeConsent",
                    resources: [
                        .process("Resources")
                    ],
                    swiftSettings: [
                        .define("DEBUG", .when(configuration: .debug))
                    ]
                )
            ]
        )
        EOF
        cat Package.swift
    
    - name: Build XCFramework (Debug)
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework in Debug mode..."
        
        # Show what we're building
        echo "=== Sources Directory ==="
        ls -la Sources/CookiePrimeConsent/
        echo "=== Total Swift Files ==="
        find Sources -name "*.swift" | wc -l
        
        # Build for iOS (device)
        echo "📱 Building for iOS..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            OTHER_SWIFT_FLAGS="-Xswiftc -enable-library-evolution" \
            || { echo "❌ iOS build failed"; exit 1; }
        
        # Build for Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/ios-simulator.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            OTHER_SWIFT_FLAGS="-Xswiftc -enable-library-evolution" \
            || { echo "❌ Simulator build failed"; exit 1; }
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework build/ios.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework \
            -framework build/ios-simulator.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework \
            -output CookiePrimeConsent.xcframework
        
        # Zip
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework
        
        echo "✅ Build complete!"
        ls -la CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
