name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Create Package.swift
      run: |
        cat > Package.swift << 'EOF'
        // swift-tools-version:5.9
        import PackageDescription

        let package = Package(
            name: "CookiePrimeConsent",
            platforms: [
                .iOS(.v14)
            ],
            products: [
                .library(
                    name: "CookiePrimeConsent",
                    targets: ["CookiePrimeConsent"]
                )
            ],
            dependencies: [],
            targets: [
                .target(
                    name: "CookiePrimeConsent",
                    path: "Sources/CookiePrimeConsent",
                    resources: [
                        .process("Resources")
                    ],
                    swiftSettings: [
                        .define("DEBUG", .when(configuration: .debug))
                    ]
                )
            ]
        )
        EOF
        echo "✅ Package.swift created"
    
    - name: Build XCFramework (Debug)
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework in Debug mode..."
        
        # Show what we're building (minimal info)
        echo "📁 Sources: $(find Sources -name "*.swift" | wc -l | xargs) Swift files"
        
        # Build for iOS (device) - with quiet output, only show errors
        echo "📱 Building for iOS..."
        if ! xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -archivePath build/ios.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            -quiet 2>&1 | tee build_ios.log; then
            echo "❌ iOS build failed"
            echo "--- Last 50 lines of build log ---"
            tail -50 build_ios.log
            exit 1
        fi
        echo "✅ iOS build succeeded"
        
        # Build for Simulator - with quiet output
        echo "📱 Building for iOS Simulator..."
        if ! xcodebuild archive \
            -scheme CookiePrimeConsent \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -archivePath build/ios-simulator.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -derivedDataPath DerivedData \
            -quiet 2>&1 | tee build_simulator.log; then
            echo "❌ Simulator build failed"
            echo "--- Last 50 lines of build log ---"
            tail -50 build_simulator.log
            exit 1
        fi
        echo "✅ Simulator build succeeded"
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework build/ios.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework \
            -framework build/ios-simulator.xcarchive/Products/Library/Frameworks/CookiePrimeConsent.framework \
            -output CookiePrimeConsent.xcframework 2>&1 | tee xcframework.log
        
        if [ ! -d "CookiePrimeConsent.xcframework" ]; then
            echo "❌ XCFramework creation failed"
            cat xcframework.log
            exit 1
        fi
        echo "✅ XCFramework created"
        
        # Zip
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        echo "✅ Zip complete"
        
        # Show final output
        echo "📦 Build artifacts:"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
