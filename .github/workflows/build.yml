name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Find the built frameworks
        echo "🔍 Finding frameworks..."
        
        IOS_FRAMEWORK=$(find DerivedData -path "*/Release-iphoneos/*.framework" -name "CookiePrimeConsent.framework" -type d | head -1)
        SIM_FRAMEWORK=$(find DerivedData -path "*/Release-iphonesimulator/*.framework" -name "CookiePrimeConsent.framework" -type d | head -1)
        
        echo "iOS framework: $IOS_FRAMEWORK"
        echo "Simulator framework: $SIM_FRAMEWORK"
        
        if [ -z "$IOS_FRAMEWORK" ] || [ -z "$SIM_FRAMEWORK" ]; then
          echo "❌ Could not find frameworks"
          echo "=== Build Products ==="
          find DerivedData/Build/Products -type d | head -20
          exit 1
        fi
        
        # Create build directory for our packaged frameworks
        mkdir -p build/ios
        mkdir -p build/sim
        
        # Copy frameworks
        echo "📦 Copying frameworks..."
        cp -r "$IOS_FRAMEWORK" build/ios/
        cp -r "$SIM_FRAMEWORK" build/sim/
        
        # Find the .swiftmodule directories
        echo "🔍 Finding .swiftmodule directories..."
        
        IOS_SWIFTMODULE=$(find DerivedData -path "*/Release-iphoneos/*.swiftmodule" -type d | head -1)
        SIM_SWIFTMODULE=$(find DerivedData -path "*/Release-iphonesimulator/*.swiftmodule" -type d | head -1)
        
        echo "iOS .swiftmodule: $IOS_SWIFTMODULE"
        echo "Simulator .swiftmodule: $SIM_SWIFTMODULE"
        
        # Create Modules directories in the frameworks
        echo "📦 Creating Modules directories..."
        mkdir -p build/ios/CookiePrimeConsent.framework/Modules
        mkdir -p build/sim/CookiePrimeConsent.framework/Modules
        
        # Copy Swift module files
        echo "📦 Copying Swift module files..."
        
        if [ -d "$IOS_SWIFTMODULE" ]; then
          echo "Copying iOS .swiftmodule files..."
          cp -r "$IOS_SWIFTMODULE"/* build/ios/CookiePrimeConsent.framework/Modules/ 2>/dev/null || true
        fi
        
        if [ -d "$SIM_SWIFTMODULE" ]; then
          echo "Copying Simulator .swiftmodule files..."
          cp -r "$SIM_SWIFTMODULE"/* build/sim/CookiePrimeConsent.framework/Modules/ 2>/dev/null || true
        fi
        
        # Also copy .swiftinterface files from build products if they exist
        echo "📦 Looking for .swiftinterface files..."
        
        IOS_INTERFACE=$(find DerivedData -path "*/Release-iphoneos/*.swiftinterface" -type f | head -1)
        SIM_INTERFACE=$(find DerivedData -path "*/Release-iphonesimulator/*.swiftinterface" -type f | head -1)
        
        if [ -f "$IOS_INTERFACE" ]; then
          echo "Copying iOS .swiftinterface: $IOS_INTERFACE"
          cp "$IOS_INTERFACE" build/ios/CookiePrimeConsent.framework/Modules/ 2>/dev/null || true
        fi
        
        if [ -f "$SIM_INTERFACE" ]; then
          echo "Copying Simulator .swiftinterface: $SIM_INTERFACE"
          cp "$SIM_INTERFACE" build/sim/CookiePrimeConsent.framework/Modules/ 2>/dev/null || true
        fi
        
        # Create module.modulemap
        echo "📦 Creating module.modulemap..."
        
        cat > build/ios/CookiePrimeConsent.framework/Modules/module.modulemap << 'EOF'
        framework module CookiePrimeConsent {
          export *
        }
        EOF
        
        cp build/ios/CookiePrimeConsent.framework/Modules/module.modulemap build/sim/CookiePrimeConsent.framework/Modules/
        
        # Verify the Modules directories
        echo "=== iOS Modules ==="
        ls -la build/ios/CookiePrimeConsent.framework/Modules/ 2>/dev/null || echo "No Modules!"
        echo "=== Simulator Modules ==="
        ls -la build/sim/CookiePrimeConsent.framework/Modules/ 2>/dev/null || echo "No Modules!"
        
        # Create XCFramework
        echo "📦 Creating XCFramework..."
        xcodebuild -create-xcframework \
            -framework build/ios/CookiePrimeConsent.framework \
            -framework build/sim/CookiePrimeConsent.framework \
            -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        echo "✅ XCFramework created"
        
        # Verify structure
        echo "📦 Verifying XCFramework..."
        find CookiePrimeConsent.xcframework -type f | head -30
        
        # Zip
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        echo "✅ Build complete!"
        echo "📦 Artifact: CookiePrimeConsent.xcframework.zip"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CookiePrimeConsent.xcframework.zip
        generate_release_notes: true
