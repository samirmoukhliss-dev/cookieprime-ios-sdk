name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Build XCFramework
      run: |
        set -e
        echo "📦 Building CookiePrime iOS SDK XCFramework..."
        
        # Build for iOS device
        echo "📱 Building for iOS device..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ iOS build failed"; exit 1; }
        echo "✅ iOS build succeeded"
        
        # Build for iOS Simulator
        echo "📱 Building for iOS Simulator..."
        xcodebuild build \
            -scheme CookiePrimeConsent \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            SKIP_INSTALL=NO \
            -derivedDataPath DerivedData \
            -quiet || { echo "❌ Simulator build failed"; exit 1; }
        echo "✅ Simulator build succeeded"
        
        # Find the built products
        echo "🔍 Finding build products..."
        
        # Look for frameworks or static libraries
        IOS_FRAMEWORK=$(find DerivedData/Build/Products -path "*/Release-iphoneos/*.framework" -type d | head -1)
        SIM_FRAMEWORK=$(find DerivedData/Build/Products -path "*/Release-iphonesimulator/*.framework" -type d | head -1)
        
        if [ -n "$IOS_FRAMEWORK" ] && [ -n "$SIM_FRAMEWORK" ]; then
            echo "✅ Found frameworks!"
            echo "iOS framework: $IOS_FRAMEWORK"
            echo "Simulator framework: $SIM_FRAMEWORK"
            
            # Create XCFramework from frameworks
            xcodebuild -create-xcframework \
                -framework "$IOS_FRAMEWORK" \
                -framework "$SIM_FRAMEWORK" \
                -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        else
            # Look for static libraries
            echo "⚠️ No frameworks found, looking for static libraries..."
            IOS_LIB=$(find DerivedData/Build/Products -path "*/Release-iphoneos/*.a" -type f | head -1)
            SIM_LIB=$(find DerivedData/Build/Products -path "*/Release-iphonesimulator/*.a" -type f | head -1)
            
            if [ -z "$IOS_LIB" ] || [ -z "$SIM_LIB" ]; then
                echo "❌ Could not find static libraries either"
                echo "Contents of DerivedData/Build/Products:"
                find DerivedData/Build/Products -type f | head -20
                exit 1
            fi
            
            echo "iOS static library: $IOS_LIB"
            echo "Simulator static library: $SIM_LIB"
            
            # Create XCFramework from static libraries
            xcodebuild -create-xcframework \
                -library "$IOS_LIB" \
                -library "$SIM_LIB" \
                -output CookiePrimeConsent.xcframework || { echo "❌ XCFramework creation failed"; exit 1; }
        fi
        
        echo "✅ XCFramework created"
        
        # Verify the XCFramework
        echo "📦 Verifying XCFramework..."
        find CookiePrimeConsent.xcframework -type f | head -10
        
        # Zip it
        echo "📦 Zipping XCFramework..."
        zip -r CookiePrimeConsent.xcframework.zip CookiePrimeConsent.xcframework > /dev/null
        
        # Show final output
        echo "✅ Build complete!"
        echo "📦 Artifact size: $(du -h CookiePrimeConsent.xcframework.zip | cut -f1)"
        ls -lh CookiePrimeConsent.xcframework.zip
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CookiePrimeConsent.xcframework
        path: CookiePrimeConsent.xcframework.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          CookiePrimeConsent.xcframework.zip
          LICENSE
          README.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
